<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="docTitle">Teacher Evaluation Form - Al Manahal International School</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #f4f7f6;
            padding: 30px 15px;
        }
        .container {
            max-width: 950px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            position: relative;
        }
        
        .header-section {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 15px;
        }
        .header-section h2 {
            color: #1a365d;
            font-size: 22px;
            margin-bottom: 5px;
        }
        .header-section p {
            color: #718096;
            font-size: 14px;
        }
        
        .info-bar {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .info-grid-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            align-items: center;
        }

        .info-grid-supervisors {
            display: flex;
            align-items: center;
            gap: 12px;
            border-top: 1px dashed #e2e8f0;
            padding-top: 12px;
        }

        .info-field {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
        }
        
        .info-label {
            font-size: 14px;
            font-weight: bold;
            color: #2d3748;
            white-space: nowrap;
        }
        
        .info-input {
            width: 100%;
            padding: 8px 10px;
            font-size: 14px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            outline: none;
            transition: border-color 0.2s;
        }
        .info-input:focus {
            border-color: #3182ce;
            box-shadow: 0 0 0 2px rgba(49, 130, 206, 0.2);
        }

        input[type="date"] {
            direction: ltr !important;
            text-align: left !important;
            font-family: Arial, sans-serif !important;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid #edf2f7;
        }

        html[dir="ltr"] th, html[dir="ltr"] td { text-align: left; }
        html[dir="rtl"] th, html[dir="rtl"] td { text-align: right; }

        th {
            background-color: #2b6cb0;
            color: #ffffff !important;
            font-size: 16px;
            font-weight: bold;
        }

        html[dir="ltr"] th:first-child { border-top-left-radius: 8px; }
        html[dir="ltr"] th:last-child { border-top-right-radius: 8px; }
        html[dir="rtl"] th:first-child { border-top-right-radius: 8px; }
        html[dir="rtl"] th:last-child { border-top-left-radius: 8px; }
        
        .num-col { width: 8%; text-align: center !important; font-weight: bold; color: #4a5568; }
        .title-col { width: 62%; font-size: 15px; color: #2d3748; }
        .max-col { width: 15%; text-align: center !important; color: #718096; font-size: 14px; }
        .input-col { width: 15%; text-align: center !important; }

        .score-input {
            width: 75px;
            padding: 8px;
            font-size: 16px;
            text-align: center;
            border: 1.5px solid #cbd5e0;
            border-radius: 6px;
            font-weight: bold;
            color: #2d3748;
            transition: all 0.2s;
        }
        .score-input:focus {
            outline: none;
            border-color: #3182ce;
            box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.2);
        }

        .total-row {
            background-color: #ebf8ff;
            font-weight: bold;
        }
        .total-row td {
            border-bottom: none;
            padding: 16px;
            font-size: 18px;
            color: #2b6cb0;
        }
        .total-score-box {
            font-size: 22px;
            color: #2b6cb0;
            font-weight: bold;
            text-align: center !important;
        }

        .actions {
            margin-top: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn {
            padding: 10px 24px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: background 0.2s;
        }
        .btn-back { background-color: #718096; color: white; }
        .btn-back:hover { background-color: #4a5568; }
        
        .btn-download { background-color: #38a169; color: white; }
        .btn-download:hover { background-color: #2f855a; }

        .btn-reset { background-color: #e53e3e; color: white; }
        .btn-reset:hover { background-color: #c53030; }

        @media print {
            .actions, .btn { display: none !important; }
            body { background-color: #fff; padding: 0; }
            .container { box-shadow: none; border: none; width: 100%; max-width: 100%; }
            th {
                background-color: #2b6cb0 !important;
                color: #ffffff !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-section">
        <h2 id="pageTitle">استمارة تقييم المدرسين</h2>
        <p id="pageSubTitle">المكتب الأكاديمي - العام الدراسي 2026 / 2027</p>
    </div>

    <form id="evalForm">
        <div class="info-bar">
            <div class="info-grid-4">
                <div class="info-field">
                    <span class="info-label" id="lblTeacher">اسم المدرس:</span>
                    <input type="text" class="info-input" id="inpTeacher" placeholder="اسم المدرس">
                </div>

                <div class="info-field">
                    <span class="info-label" id="lblSubject">اسم المادة:</span>
                    <input type="text" class="info-input" id="inpSubject" placeholder="المادة">
                </div>

                <div class="info-field">
                    <span class="info-label" id="lblLesson">عنوان الدرس:</span>
                    <input type="text" class="info-input" id="inpLesson" placeholder="عنوان الدرس">
                </div>

                <div class="info-field">
                    <span class="info-label" id="lblDate">التاريخ:</span>
                    <input type="date" class="info-input" id="inpDate" lang="en">
                </div>
            </div>

            <div class="info-grid-supervisors">
                <span class="info-label" id="lblSupervisor">المشرف العلمي:</span>
                <input type="text" class="info-input" id="inpSupervisor1" placeholder="اسم المشرف الأول" style="max-width: 250px;">
                <input type="text" class="info-input" id="inpSupervisor2" placeholder="اسم المشرف الثاني" style="max-width: 250px;">
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th class="num-col" style="color: #ffffff !important;">#</th>
                    <th class="title-col" id="thItem" style="color: #ffffff !important;">البند</th>
                    <th class="max-col" id="thMax" style="color: #ffffff !important;">الدرجة العظمى</th>
                    <th class="input-col" id="thScore" style="color: #ffffff !important;">الدرجة</th>
                </tr>
            </thead>
            <tbody id="itemsTableBody"></tbody>
            <tfoot>
                <tr class="total-row">
                    <td colspan="2" id="lblTotal" style="text-align: inherit;">المجموع الإجمالي:</td>
                    <td class="max-col" style="font-weight: bold; color: #2b6cb0;">100</td>
                    <td class="total-score-box" id="totalScore">0</td>
                </tr>
            </tfoot>
        </table>

    <div class="notes-container">
        <label for="supervisorNotes" id="lblSupervisorNotes">ملاحظات المشرف العلمي:</label>
        <textarea id="supervisorNotes" rows="4" placeholder="اكتب ملاحظاتك أو توصياتك هنا..."></textarea>
    </div>
</div>

<style>
    .summary-section {
        margin-top: 20px;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .total-score-box {
        background-color: #ebf8ff;
        border: 2px solid #2b6cb0;
        border-radius: 8px;
        padding: 12px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 18px;
        font-weight: bold;
        color: #2b6cb0;
    }

    .notes-container {
        display: flex;
        flex-direction: column;
        gap: 8px;
        text-align: right;
    }

    .notes-container label {
        font-weight: bold;
        color: #1a365d;
        font-size: 15px;
    }

    .notes-container textarea {
        width: 100%;
        padding: 12px;
        border: 1px solid #cbd5e0;
        border-radius: 6px;
        font-size: 14px;
        resize: vertical;
        box-sizing: border-box;
    }

    .notes-container textarea:focus {
        outline: none;
        border-color: #2b6cb0;
        box-shadow: 0 0 0 2px rgba(43, 108, 176, 0.2);
    }
</style>
        
        <div class="actions">
            <a href="index.html" class="btn btn-back" id="btnBack">العودة للرئيسية</a>
            <button type="button" class="btn btn-download" id="btnDownload" onclick="downloadEvaluation()">تحميل</button>
            <button type="button" class="btn btn-reset" id="btnReset" onclick="resetForm()">تفريغ الخانات</button>
        </div>
    </form>
</div>

<script>
    const itemsData = [
        { ar: "مدى تحقق أهداف الدرس", en: "Achievement of lesson objectives", tr: "Ders hedeflerine ulaşma düzeyi", max: 10, noteAr: "", noteEn: "", noteTr: "" },
        { ar: "الإدارة الصفية الناجحة", en: "Successful classroom management", tr: "Başarılı sınıf yönetimi", max: 10, noteAr: "", noteEn: "", noteTr: "" },
        { ar: "الالتزام بالخطة السنوية", en: "Adherence to the annual plan", tr: "Yıllık plana uyum", max: 6, noteAr: "", noteEn: "", noteTr: "" },
        { ar: "استخدام الوسائل المتاحة والمناسبة", en: "Use of available and suitable learning aids", tr: "Uygun ve mevcut materyallerin kullanımı", max: 6, noteAr: "", noteEn: "", noteTr: "" },
        { ar: "التقييم المرحلي والنهائي", en: "Formative and summative assessment", tr: "Süreç ve sonuç değerlendirmesi", max: 6, noteAr: "(3+3)", noteEn: "(3+3)", noteTr: "(3+3)" },
        { ar: "التحضير المسبق للدرس", en: "Advance lesson preparation", tr: "Önceden ders hazırlığı", max: 8, noteAr: "(4+4)", noteEn: "(4+4)", noteTr: "(4+4)" },
        { ar: "التعاون مع الإشراف وروح المبادرة", en: "Cooperation with supervision and initiative", tr: "Denetimle iş birliği ve girişimcilik", max: 8, noteAr: "(4+4)", noteEn: "(4+4)", noteTr: "(4+4)" },
        { ar: "مهارات التواصل اللفظية والجسدية", en: "Verbal and non-verbal communication skills", tr: "Sözlü ve beden dili iletişim becerileri", max: 6, noteAr: "", noteEn: "", noteTr: "" },
        { ar: "توظيف التعزيز", en: "Effective use of positive reinforcement", tr: "Pekiştireçlerin etkin kullanımı", max: 6, noteAr: "", noteEn: "", noteTr: "" },
        { ar: "ربط المحتوى العلمي بالواقع", en: "Linking scientific content to real life", tr: "Akademik içeriği gerçek hayatla bağdaştırma", max: 4, noteAr: "", noteEn: "", noteTr: "" },
        { ar: "مهارة طرح الأسئلة", en: "Questioning skills", tr: "Soru sorma becerisi", max: 5, noteAr: "", noteEn: "", noteTr: "" },
        { ar: "مراعاة الفروق الفردية", en: "Catering to individual differences", tr: "Bireysel farklılıkları gözetme", max: 5, noteAr: "", noteEn: "", noteTr: "" },
        { ar: "التنويع في الأساليب والطرائق", en: "Diversification of teaching methods", tr: "Yöntem ve tekniklerde çeşitlilik", max: 10, noteAr: "", noteEn: "", noteTr: "" },
        { ar: "تطوير الذات والإلمام بالمادة العلمية", en: "Self-development and subject mastery", tr: "Kendini geliştirme ve alan hakimiyeti", max: 6, noteAr: "(3+3)", noteEn: "(3+3)", noteTr: "(3+3)" },
        { ar: "تعزيز الهدف القيمي", en: "Reinforcement of core values", tr: "Değerler eğitiminin desteklenmesi", max: 4, noteAr: "", noteEn: "", noteTr: "" }
    ];

    const uiTexts = {
        ar: {
            docTitle: "استمارة تقييم المدرسين - مدرسة المناهل الدولية",
            pageTitle: "استمارة تقييم المدرسين",
            pageSubTitle: "المكتب الأكاديمي - العام الدراسي 2026 / 2027",
            lblTeacher: "اسم المدرس:",
            inpTeacher: "اسم المدرس",
            lblSubject: "اسم المادة:",
            inpSubject: "المادة",
            lblLesson: "عنوان الدرس:",
            inpLesson: "عنوان الدرس",
            lblDate: "التاريخ:",
            lblSupervisor: "المشرف العلمي:",
            inpSupervisor1: "اسم المشرف الأول",
            inpSupervisor2: "اسم المشرف الثاني",
            thItem: "البند",
            thMax: "الدرجة العظمى",
            thScore: "الدرجة",
            lblTotal: "المجموع الإجمالي:",
            btnBack: "العودة للرئيسية",
            btnDownload: "تحميل",
            btnReset: "تفريغ الخانات"
        },
        en: {
            docTitle: "Teacher Evaluation Form - Al Manahal International School",
            pageTitle: "Teacher Evaluation Form",
            pageSubTitle: "Academic Office - Academic Year 2026 / 2027",
            lblTeacher: "Teacher's Name:",
            inpTeacher: "Teacher's Name",
            lblSubject: "Subject:",
            inpSubject: "Subject",
            lblLesson: "Lesson Title:",
            inpLesson: "Lesson Title",
            lblDate: "Date:",
            lblSupervisor: "Academic Supervisor:",
            inpSupervisor1: "First Supervisor",
            inpSupervisor2: "Second Supervisor",
            thItem: "Item",
            thMax: "Max Grade",
            thScore: "Grade",
            lblTotal: "Total Score:",
            btnBack: "Back to Home",
            btnDownload: "Download",
            btnReset: "Reset Form"
        },
        tr: {
            docTitle: "Öğretmen Değerlendirme Formu - El Manahal Uluslararası Okulu",
            pageTitle: "Öğretmen Değerlendirme Formu",
            pageSubTitle: "Akademik Ofis - 2026 / 2027 Eğitim Öğretim Yılı",
            lblTeacher: "Öğretmenin Adı:",
            inpTeacher: "Öğretmenin Adı",
            lblSubject: "Dersin Adı:",
            inpSubject: "Ders",
            lblLesson: "Ders Konusu:",
            inpLesson: "Ders Konusu",
            lblDate: "Tarih:",
            lblSupervisor: "Akademik Danışman:",
            inpSupervisor1: "Birinci Danışman",
            inpSupervisor2: "İkinci Danışman",
            thItem: "Değerlendirme Kriteri",
            thMax: "Maks. Puan",
            thScore: "Puan",
            lblTotal: "Toplam Puan:",
            btnBack: "Ana Sayfaya Dön",
            btnDownload: "İndir",
            btnReset: "Formu Temizle"
        }
    };

    function renderTable(lang) {
        const tableBody = document.getElementById('itemsTableBody');
        tableBody.innerHTML = '';

        itemsData.forEach((item, index) => {
            const row = document.createElement('tr');
            const title = item[lang] || item.ar;
            const note = lang === 'ar' ? item.noteAr : (lang === 'en' ? item.noteEn : item.noteTr);
            const noteText = note ? ` <small style="color:#718096;">${note}</small>` : '';

            row.innerHTML = `
                <td class="num-col">${index + 1}</td>
                <td class="title-col">${title} ${noteText}</td>
                <td class="max-col">${item.max}</td>
                <td class="input-col">
                    <input type="number" 
                           class="score-input" 
                           min="0" 
                           max="${item.max}" 
                           placeholder="0-${item.max}" 
                           data-max="${item.max}"
                           oninput="calculateTotal(this)">
                </td>
            `;
            tableBody.appendChild(row);
        });
    }

    function applyLanguage(lang) {
        const htmlTag = document.getElementById('htmlTag');
        htmlTag.lang = lang;
        htmlTag.dir = lang === 'ar' ? 'rtl' : 'ltr';

        const txt = uiTexts[lang];
        document.getElementById('docTitle').innerText = txt.docTitle;
        document.getElementById('pageTitle').innerText = txt.pageTitle;
        document.getElementById('pageSubTitle').innerText = txt.pageSubTitle;
        document.getElementById('lblTeacher').innerText = txt.lblTeacher;
        document.getElementById('inpTeacher').placeholder = txt.inpTeacher;
        document.getElementById('lblSubject').innerText = txt.lblSubject;
        document.getElementById('inpSubject').placeholder = txt.inpSubject;
        document.getElementById('lblLesson').innerText = txt.lblLesson;
        document.getElementById('inpLesson').placeholder = txt.inpLesson;
        document.getElementById('lblDate').innerText = txt.lblDate;
        document.getElementById('lblSupervisor').innerText = txt.lblSupervisor;
        document.getElementById('inpSupervisor1').placeholder = txt.inpSupervisor1;
        document.getElementById('inpSupervisor2').placeholder = txt.inpSupervisor2;
        
        document.getElementById('thItem').innerText = txt.thItem;
        document.getElementById('thMax').innerText = txt.thMax;
        document.getElementById('thScore').innerText = txt.thScore;
        document.getElementById('lblTotal').innerText = txt.lblTotal;
        
        document.getElementById('btnBack').innerText = txt.btnBack;
        document.getElementById('btnDownload').innerText = txt.btnDownload;
        document.getElementById('btnReset').innerText = txt.btnReset;

        renderTable(lang);
        calculateTotal();
    }

    function calculateTotal(inputElement) {
        if (inputElement) {
            const maxVal = parseFloat(inputElement.getAttribute('data-max'));
            let currentVal = parseFloat(inputElement.value);

            if (currentVal > maxVal) {
                inputElement.value = maxVal;
            } else if (currentVal < 0) {
                inputElement.value = 0;
            }
        }

        const inputs = document.querySelectorAll('.score-input');
        let total = 0;
        inputs.forEach(input => {
            const val = parseFloat(input.value);
            if (!isNaN(val)) {
                total += val;
            }
        });

        document.getElementById('totalScore').innerText = total;
    }

    function resetForm() {
        document.getElementById('evalForm').reset();
        document.getElementById('totalScore').innerText = '0';
    }

    function downloadEvaluation() {
        window.open("https://drive.google.com/drive/folders/1zI1jQ04r3SSyqGHaXH6N_UskYeii1-PP?usp=sharing", "_blank");
        window.print();
    }

    window.onload = function() {
        const savedLang = localStorage.getItem('siteLang') || 'ar';
        applyLanguage(savedLang);
    };
</script>

</body>
</html>
