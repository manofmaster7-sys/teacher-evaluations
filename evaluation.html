
<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="docTitle">استمارة تقييم المدرسين - مدرسة المناهل الدولية</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #f4f7f6;
            color: #2d3748;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        /* الهيدر والأزرار */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 2px solid #e2e8f0;
            margin-bottom: 20px;
            direction: ltr !important;
        }
        .logo-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 140px;
        }
        .logo-container {
            width: 120px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .lang-buttons {
            display: flex;
            gap: 5px;
            direction: ltr !important;
        }
        .btn-lang {
            background-color: #2b6cb0;
            color: #ffffff;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-lang:hover {
            background-color: #1a365d;
        }
        .header-title {
            text-align: center;
            flex-grow: 1;
        }
        .header-title h1 {
            font-size: 20px;
            color: #1a365d;
        }
        .header-title h2 {
            font-size: 15px;
            color: #4a5568;
            font-weight: normal;
        }
        .right-logo-container {
            width: 140px;
            display: flex;
            justify-content: center;
        }

        /* شبكة معلومات التقييم */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
            background-color: #f8fafc;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .form-group label {
            font-weight: bold;
            font-size: 14px;
            color: #2c5282;
        }
        .form-group input {
            padding: 8px 12px;
            border: 1px solid #cbd5e0;
            border-radius: 5px;
            font-size: 14px;
        }

        /* جدول البنود */
        .eval-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        .eval-table th, .eval-table td {
            border: 1px solid #cbd5e0;
            padding: 10px;
            text-align: start;
        }
        .eval-table th {
            background-color: #2b6cb0;
            color: white;
            font-size: 15px;
        }
        .eval-table td.center {
            text-align: center;
        }
        .score-input {
            width: 60px;
            padding: 5px;
            text-align: center;
            border: 1px solid #cbd5e0;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
        }

        /* المجموع والملاحظات */
        .summary-section {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .total-score-box {
            background-color: #ebf8ff;
            border: 2px solid #2b6cb0;
            border-radius: 8px;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            color: #2b6cb0;
        }
        .notes-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .notes-container label {
            font-weight: bold;
            color: #1a365d;
            font-size: 15px;
        }
        .notes-container textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 14px;
            resize: vertical;
        }

        /* الأزرار التحكمية */
        .actions-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }
        .btn-action {
            padding: 12px 15px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            color: white;
            text-align: center;
        }
        .btn-back { background-color: #718096; }
        .btn-reset { background-color: #e53e3e; }
        .btn-print { background-color: #38a169; }
        .btn-save { background-color: #2b6cb0; }

        @media print {
            .lang-buttons, .actions-container { display: none !important; }
            body { background: white; padding: 0; }
            .container { box-shadow: none; padding: 0; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo-wrapper">
            <div class="logo-container">
                <img src="school-logo.png" alt="School Logo">
            </div>
            <div class="lang-buttons">
                <button class="btn-lang" onclick="setLanguage('ar')">AR</button>
                <button class="btn-lang" onclick="setLanguage('en')">EN</button>
                <button class="btn-lang" onclick="setLanguage('tr')">TR</button>
            </div>
        </div>
        <div class="header-title">
            <h1 id="deptTitle">المكتب الأكاديمي</h1>
            <h2 id="yearTitle">تقييمات المدرسين للعام الدراسي 2026 - 2027</h2>
        </div>
        <div class="right-logo-container">
            <div class="logo-container">
                <img src="association-logo.png" alt="Association Logo">
            </div>
        </div>
    </header>

    <!-- معلومات التقييم -->
    <div class="info-grid">
        <div class="form-group">
            <label id="lblTeacher">اسم المدرس:</label>
            <input type="text" id="teacherName">
        </div>
        <div class="form-group">
            <label id="lblSubject">اسم المادة:</label>
            <input type="text" id="subject">
        </div>
        <div class="form-group">
            <label id="lblLesson">عنوان الدرس:</label>
            <input type="text" id="lesson">
        </div>
        <div class="form-group">
            <label id="lblSupervisor1">المشرف العلمي الأول:</label>
            <input type="text" id="supervisor1">
        </div>
        <div class="form-group">
            <label id="lblSupervisor2">المشرف العلمي الثاني:</label>
            <input type="text" id="supervisor2">
        </div>
        <div class="form-group">
            <label id="lblDate">التاريخ:</label>
            <input type="date" id="evalDate">
        </div>
    </div>

    <!-- جدول التقييم -->
    <table class="eval-table">
        <thead>
            <tr>
                <th style="width: 50px;" class="center">#</th>
                <th id="thItem">البند</th>
                <th style="width: 100px;" class="center" id="thMax">الدرجة العظمى</th>
                <th style="width: 100px;" class="center" id="thScore">الدرجة</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <!-- المجموع والملاحظات -->
    <div class="summary-section">
        <div class="total-score-box">
            <span id="lblTotalScore">المجموع الإجمالي:</span>
            <span id="totalScoreValue">0 / 100</span>
        </div>

        <div class="notes-container">
            <label for="supervisorNotes" id="lblSupervisorNotes">ملاحظات المشرف العلمي:</label>
            <textarea id="supervisorNotes" rows="4" placeholder="اكتب ملاحظاتك أو توصياتك هنا..."></textarea>
        </div>
    </div>

    <!-- التحكم والسحابة -->
    <div class="actions-container">
        <a href="index.html" class="btn-action btn-back" id="btnBack">العودة للرئيسية</a>
        <button onclick="resetForm()" class="btn-action btn-reset" id="btnReset">تفريغ الخانات</button>
        <button onclick="window.print()" class="btn-action btn-print" id="btnPrint">طباعة / حفظ PDF</button>
        <button onclick="sendToGoogleSheets()" class="btn-action btn-save" id="btnSave">حفظ التقييم</button>
    </div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz1dU706prU7zjaoqTJ12q2Ja6WGrt44f0Zhwfq7FRiDF2EC8qk3URSH_4gamy2fuVY/exec';

    const itemsData = [
        { max: 10, ar: "مدى تحقق أهداف الدرس", en: "Achievement of lesson objectives", tr: "Ders hedeflerine ulaşma düzeyi" },
        { max: 10, ar: "الإدارة الصفية الناجحة", en: "Successful classroom management", tr: "Başarılı sınıf yönetimi" },
        { max: 6,  ar: "الالتزام بالخطة السنوية", en: "Adherence to the annual plan", tr: "Yıllık plana uyum" },
        { max: 6,  ar: "استخدام الوسائل المتاحة والمناسبة", en: "Use of available learning aids", tr: "Uygun ve mevcut materyallerin kullanımı" },
        { max: 6,  ar: "التقييم المرحلي والنهائي (3+3)", en: "Formative & summative assessment (3+3)", tr: "Süreç ve sonuç değerlendirmesi (3+3)" },
        { max: 8,  ar: "التحضير المسبق للدرس (4+4)", en: "Advance lesson preparation (4+4)", tr: "Önceden ders hazırlığı (4+4)" },
        { max: 8,  ar: "التعاون مع الإشراف وروح المبادرة (4+4)", en: "Cooperation with supervision (4+4)", tr: "Denetimle iş birliği ve girişimcilik (4+4)" },
        { max: 6,  ar: "مهارات التواصل اللفظية والجسدية", en: "Verbal and non-verbal communication skills", tr: "Sözlü ve beden dili iletişim becerileri" },
        { max: 6,  ar: "توظيف التعزيز", en: "Effective use of reinforcement", tr: "Pekiştireçlerin etkin kullanımı" },
        { max: 4,  ar: "ربط المحتوى العلمي بالواقع", en: "Linking scientific content to real life", tr: "Akademik içeriği gerçek hayatla bağdaştırma" },
        { max: 5,  ar: "مهارة طرح الأسئلة", en: "Questioning skills", tr: "Soru sorma becerisi" },
        { max: 5,  ar: "مراعاة الفروق الفردية", en: "Catering to individual differences", tr: "Bireysel farklılıkları gözetme" },
        { max: 10, ar: "التنويع في الأساليب والطرائق", en: "Diversification of teaching methods", tr: "Yöntem ve tekniklerde çeşitlilik" },
        { max: 6,  ar: "تطوير الذات والإلمام بالمادة العلمية (3+3)", en: "Self-development & subject mastery (3+3)", tr: "Kendini geliştirme ve alan hakimiyeti (3+3)" },
        { max: 4,  ar: "تعزيز الهدف القيمي", en: "Reinforcement of core values", tr: "Değerler eğitiminin desteklenmesi" }
    ];

    const translations = {
        ar: {
            docTitle: "استمارة تقييم المدرسين - مدرسة المناهل الدولية",
            deptTitle: "المكتب الأكاديمي",
            yearTitle: "تقييمات المدرسين للعام الدراسي 2026 - 2027",
            lblTeacher: "اسم المدرس:",
            lblSubject: "اسم المادة:",
            lblLesson: "عنوان الدرس:",
            lblSupervisor1: "المشرف العلمي الأول:",
            lblSupervisor2: "المشرف العلمي الثاني:",
            lblDate: "التاريخ:",
            thItem: "البند",
            thMax: "الدرجة العظمى",
            thScore: "الدرجة",
            lblTotalScore: "المجموع الإجمالي:",
            lblSupervisorNotes: "ملاحظات المشرف العلمي:",
            phNotes: "اكتب ملاحظاتك أو توصياتك هنا...",
            btnBack: "العودة للرئيسية",
            btnReset: "تفريغ الخانات",
            btnPrint: "طباعة / حفظ PDF",
            btnSave: "حفظ التقييم"
        },
        en: {
            docTitle: "Teacher Evaluation Form - Al Manahal International School",
            deptTitle: "Academic Office",
            yearTitle: "Teacher Evaluations for Academic Year 2026 - 2027",
            lblTeacher: "Teacher Name:",
            lblSubject: "Subject:",
            lblLesson: "Lesson Title:",
            lblSupervisor1: "First Academic Supervisor:",
            lblSupervisor2: "Second Academic Supervisor:",
            lblDate: "Date:",
            thItem: "Evaluation Item",
            thMax: "Max Grade",
            thScore: "Score",
            lblTotalScore: "Total Score:",
            lblSupervisorNotes: "Academic Supervisor Notes:",
            phNotes: "Write your notes or recommendations here...",
            btnBack: "Back to Home",
            btnReset: "Reset Form",
            btnPrint: "Print / Save PDF",
            btnSave: "Save Evaluation"
        },
        tr: {
            docTitle: "Öğretmen Değerlendirme Formu - El Manahal Uluslararası Okulu",
            deptTitle: "Akademik Ofis",
            yearTitle: "2026 - 2027 Eğitim Öğretim Yılı Öğretmen Değerlendirmeleri",
            lblTeacher: "Öğretmenin Adı:",
            lblSubject: "Dersin Adı:",
            lblLesson: "Ders Konusu:",
            lblSupervisor1: "1. Akademik Danışman:",
            lblSupervisor2: "2. Akademik Danışman:",
            lblDate: "Tarih:",
            thItem: "Değerlendirme Kriteri",
            thMax: "Maks. Puan",
            thScore: "Puan",
            lblTotalScore: "Toplam Puan:",
            lblSupervisorNotes: "Akademik Danışman Notları:",
            phNotes: "Notlarınızı veya önerilerinizi buraya yazın...",
            btnBack: "Ana Sayfaya Dön",
            btnReset: "Formu Temizle",
            btnPrint: "Yazdır / PDF Kaydet",
            btnSave: "Kaydet"
        }
    };

    let currentLang = 'ar';

    function renderTable() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        itemsData.forEach((item, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="center">${index + 1}</td>
                <td>${item[currentLang]}</td>
                <td class="center">${item.max}</td>
                <td class="center">
                    <input type="number" min="0" max="${item.max}" class="score-input" oninput="calculateTotal()" data-max="${item.max}">
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function calculateTotal() {
        let total = 0;
        const inputs = document.querySelectorAll('.score-input');
        inputs.forEach(input => {
            let val = parseFloat(input.value) || 0;
            const max = parseFloat(input.dataset.max);
            if (val > max) { val = max; input.value = max; }
            if (val < 0) { val = 0; input.value = 0; }
            total += val;
        });
        document.getElementById('totalScoreValue').innerText = `${total} / 100`;
    }

    function resetForm() {
        document.querySelectorAll('input').forEach(input => input.value = '');
        document.getElementById('supervisorNotes').value = '';
        calculateTotal();
    }

    function sendToGoogleSheets() {
        const btnSave = document.getElementById('btnSave');
        const teacherName = document.getElementById('teacherName').value.trim();

        if (!teacherName) {
            alert(currentLang === 'ar' ? 'يرجى كتابة اسم المدرس قبل الحفظ.' : 'Please enter the teacher name before saving.');
            return;
        }

        btnSave.innerText = currentLang === 'ar' ? 'جاري الحفظ...' : 'Saving...';
        btnSave.disabled = true;

        let scores = [];
        document.querySelectorAll('.score-input').forEach((input, idx) => {
            scores.push(`بند ${idx + 1}: ${input.value || 0}`);
        });

        const payload = {
            date: document.getElementById('evalDate').value || new Date().toISOString().split('T')[0],
            teacherName: teacherName,
            subject: document.getElementById('subject').value,
            lesson: document.getElementById('lesson').value,
            supervisor1: document.getElementById('supervisor1').value,
            supervisor2: document.getElementById('supervisor2').value,
            totalScore: document.getElementById('totalScoreValue').innerText,
            notes: document.getElementById('supervisorNotes').value,
            scoresDetail: scores.join(' | ')
        };

        fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(() => {
            alert(currentLang === 'ar' ? 'تم حفظ التقييم بنجاح في Google Sheets!' : 'Evaluation saved successfully to Google Sheets!');
            btnSave.innerText = translations[currentLang].btnSave;
            btnSave.disabled = false;
        })
        .catch(error => {
            alert(currentLang === 'ar' ? 'حدث خطأ أثناء الحفظ، يرجى المحاولة لاحقاً.' : 'An error occurred while saving.');
            btnSave.innerText = translations[currentLang].btnSave;
            btnSave.disabled = false;
        });
    }

    function applyLanguage(lang) {
        currentLang = lang;
        document.body.dir = lang === 'ar' ? 'rtl' : 'ltr';

        const t = translations[lang];
        document.getElementById('docTitle').innerText = t.docTitle;
        document.getElementById('deptTitle').innerText = t.deptTitle;
        document.getElementById('yearTitle').innerText = t.yearTitle;
        document.getElementById('lblTeacher').innerText = t.lblTeacher;
        document.getElementById('lblSubject').innerText = t.lblSubject;
        document.getElementById('lblLesson').innerText = t.lblLesson;
        document.getElementById('lblSupervisor1').innerText = t.lblSupervisor1;
        document.getElementById('lblSupervisor2').innerText = t.lblSupervisor2;
        document.getElementById('lblDate').innerText = t.lblDate;
        document.getElementById('thItem').innerText = t.thItem;
        document.getElementById('thMax').innerText = t.thMax;
        document.getElementById('thScore').innerText = t.thScore;
        document.getElementById('lblTotalScore').innerText = t.lblTotalScore;
        document.getElementById('lblSupervisorNotes').innerText = t.lblSupervisorNotes;
        document.getElementById('supervisorNotes').placeholder = t.phNotes;
        document.getElementById('btnBack').innerText = t.btnBack;
        document.getElementById('btnReset').innerText = t.btnReset;
        document.getElementById('btnPrint').innerText = t.btnPrint;
        document.getElementById('btnSave').innerText = t.btnSave;

        renderTable();
        calculateTotal();
        localStorage.setItem('siteLang', lang);
    }

    function setLanguage(lang) { applyLanguage(lang); }

    window.onload = function() {
        const savedLang = localStorage.getItem('siteLang') || 'ar';
        applyLanguage(savedLang);
    };
</script>

</body>
</html>
