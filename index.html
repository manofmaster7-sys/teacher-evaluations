
<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="docTitle">تقييمات المدرسين - مدرسة المناهل الدولية</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #f4f7f6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* تثبيت الهيدر كاملاً لعدم التأثر باتجاه اللغة */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background-color: #ffffff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            direction: ltr !important; /* تثبيت اتجاه الهيدر لليسار دائماً */
        }

        .logo-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 140px; /* تحديد عرض ثابت لمنع أي زحزحة */
        }

        .logo-container {
            width: 120px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        
        /* تثبيت أزرار اللغة بجهة اليسار تحت الشعار دائماً */
        .lang-buttons {
            display: flex;
            gap: 5px;
            direction: ltr !important;
        }

        .btn-lang {
            background-color: #2b6cb0;
            color: #ffffff;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-lang:hover {
            background-color: #1a365d;
        }

        .header-title {
            text-align: center;
            flex-grow: 1;
        }
        .header-title h1 {
            font-size: 24px;
            color: #1a365d;
            margin-bottom: 5px;
        }
        .header-title h2 {
            font-size: 18px;
            color: #4a5568;
            font-weight: normal;
        }

        .right-logo-container {
            width: 140px; /* نفس عرض الجهة اليسرى لضمان توسط العنوان بالضبط */
            display: flex;
            justify-content: center;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            width: 100%;
            max-width: 280px;
        }

        .btn {
            display: block;
            width: 100%;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            padding: 15px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.3s, transform 0.1s;
        }
        
        .btn-add {
            background-color: #2b6cb0;
            color: white;
        }
        .btn-add:hover {
            background-color: #2c5282;
            transform: translateY(-2px);
        }

        .btn-view {
            background-color: #4a5568;
            color: white;
        }
        .btn-view:hover {
            background-color: #2d3748;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <header>
        <!-- جهة اليسار: شعار المدرسة وتحته أزرار اللغة (ملاحظة: ثابتة دائماً على اليسار) -->
        <div class="logo-wrapper">
            <div class="logo-container">
                <img src="school-logo.png" alt="Logo">
            </div>
            <div class="lang-buttons">
                <button class="btn-lang" onclick="setLanguage('ar')">AR</button>
                <button class="btn-lang" onclick="setLanguage('en')">EN</button>
                <button class="btn-lang" onclick="setLanguage('tr')">TR</button>
            </div>
        </div>

        <!-- المنتصف: العنوان -->
        <div class="header-title">
            <h1 id="deptTitle">المكتب الأكاديمي</h1>
            <h2 id="yearTitle">تقييمات المدرسين للعام الدراسي 2026 - 2027</h2>
        </div>

        <!-- جهة اليمين: شعار الجمعية (ملاحظة: ثابت دائماً على اليمين) -->
        <div class="right-logo-container">
            <div class="logo-container">
                <img src="association-logo.png" alt="Association Logo">
            </div>
        </div>
    </header>

    <main>
        <div class="buttons-container">
            <a href="evaluation.html" class="btn btn-add" id="btnNewEval">تقييم جديد</a>
            <a href="https://drive.google.com/drive/folders/1zI1jQ04r3SSyqGHaXH6N_UskYeii1-PP?usp=sharing" target="_blank" class="btn btn-view" id="btnPrevEval">التقييمات السابقة</a>
        </div>
    </main>

<script>
    const translations = {
        ar: {
            docTitle: "تقييمات المدرسين - مدرسة المناهل الدولية",
            deptTitle: "المكتب الأكاديمي",
            yearTitle: "تقييمات المدرسين للعام الدراسي 2026 - 2027",
            btnNewEval: "تقييم جديد",
            btnPrevEval: "التقييمات السابقة"
        },
        en: {
            docTitle: "Teacher Evaluations - Al Manahal International School",
            deptTitle: "Academic Office",
            yearTitle: "Teacher Evaluations for Academic Year 2026 - 2027",
            btnNewEval: "New Evaluation",
            btnPrevEval: "Previous Evaluations"
        },
        tr: {
            docTitle: "Öğretmen Değerlendirmeleri - El Manahal Uluslararası Okulu",
            deptTitle: "Akademik Ofis",
            yearTitle: "2026 - 2027 Eğitim Öğretim Yılı Öğretmen Değerlendirmeleri",
            btnNewEval: "Yeni Değerlendirme",
            btnPrevEval: "Önceki Değerlendirmeler"
        }
    };

    function applyLanguage(lang) {
        const htmlTag = document.getElementById('htmlTag');
        htmlTag.lang = lang;
        
        // تغيير اتجاه جسم الصفحة فقط مع إبقاء الهيدر ثابتاً
        document.body.dir = lang === 'ar' ? 'rtl' : 'ltr';

        document.getElementById('docTitle').innerText = translations[lang].docTitle;
        document.getElementById('deptTitle').innerText = translations[lang].deptTitle;
        document.getElementById('yearTitle').innerText = translations[lang].yearTitle;
        document.getElementById('btnNewEval').innerText = translations[lang].btnNewEval;
        document.getElementById('btnPrevEval').innerText = translations[lang].btnPrevEval;

        localStorage.setItem('siteLang', lang);
    }

    function setLanguage(lang) {
        applyLanguage(lang);
    }

    window.onload = function() {
        const savedLang = localStorage.getItem('siteLang') || 'ar';
        applyLanguage(savedLang);
    };
</script>

</body>
</html>
